# Nimbus implementation status across work tracks

done:
  contracts:
    description: Wire format JSON Schemas in contracts/ (lease, escalation, robot subtask, decision log)
    files:
      - contracts/lease.schema.json
      - contracts/escalation.schema.json
      - contracts/robot_subtask.schema.json
      - contracts/decision_log_entry.schema.json
  requester_app:
    description: Static plain-language web application (FR-21) served without frameworks
    files:
      - static/index.html
      - static/app.js
  decision_log:
    description: Append-only decision log (FR-20) replayed at GET /tasks/{id}/timeline
    files:
      - store.py
      - server.py
  terraform_skeleton:
    description: AWS deployment structure (PRD Fig 4) passing terraform validate cleanly with topic names matching topics.md
    note: Terraform apply waits on the team AWS account and Bedrock quota
    files:
      - infra/terraform/main.tf
      - infra/terraform/variables.tf
      - infra/terraform/outputs.tf
      - infra/terraform/p3.tf
  cost_counters:
    description: PRD Section 7 formula tracking counters accessible at GET /cost
    files:
      - cost.py
  topics_and_outbox:
    description: Canonical topic spec in contracts/topics.md covering all five patterns (lease, escalation, checkin, renewal, probe). Terraform now matches it directly.
    files:
      - contracts/topics.md
      - store.py
      - infra/terraform/main.tf
  checkins_ingress:
    description: POST /checkins route accepting edge check-ins with FR-8 deduplication
    files:
      - server.py
  operator_console:
    description: Minimal operator console at /operator for FR-22 with pause and cancel intents recorded
    files:
      - static/operator.html
      - static/operator.js
      - server.py

p3_cloud_orchestrator_merged:
  description: Cloud orchestrator behind the existing HTTP API (cloud/, packs/); standin.py is no longer on the request path
  files:
    - cloud/
    - packs/
    - scripts/edge_sim.py
  note: Not yet run on real AWS (Bedrock and DynamoDB verified only against emulators)

stand_in:
  standin_py:
    description: Rule-based cloud stand-in simulating SC-1 clarification and lease generation
    file: standin.py
    replacement: Person 3 replaced on main request path with cloud/ orchestrator
  file_store:
    description: Local JSON and JSONL files under data/ for task state and decision log
    file: store.py
    replacement: Person 3 added DynamoDB backend option (NIMBUS_BACKEND=aws); local file store remains default for local runs
  outbox_storage:
    description: Local JSONL outbox standing in for AWS IoT Core pub/sub. HTTP is the Milestone 1 transport; IoT/MQTT is later.
    file: store.py
    replacement: Person 3 and Person 2 will wire AWS IoT Core topics and SQS queues in a later milestone

waiting:
  aws_deployment:
    action: Terraform apply waits on the team AWS account and Bedrock quota
  p2_edge_cluster:
    person: Person 2
    action: Consume outbox leases and post live edge escalations and check-ins (HTTP in Milestone 1, IoT/MQTT later)
  p1_simulation_and_eval:
    person: Person 1
    action: Provide robot position tracking for a real map and replay logs for evaluation report

out_of_scope:
  bedrock: Prompts, model invocation, and LLM orchestration (Person 3)
  gazebo: Simulation environment, physics, and world maps (Person 1)
  edge_slm: On-device SLM execution via llama.cpp on edge nodes (Person 2)
  fr18: Reduced-autonomy fallback mode during cloud outages (Person 3)
  tc_netem: Network degradation and trace harness for experiments E4 through E6 (Person 1 / Person 2)
  aws_apply: Actual terraform apply on live AWS accounts (waits on team AWS account and Bedrock quota)
