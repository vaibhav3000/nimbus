<!doctype html><html><head><meta charset="utf-8"><title>Nimbus sim viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#10151c;--fg:#e6edf3;--mut:#8b98a5;--card:#18202a}
@media (prefers-color-scheme: light){:root{--bg:#f4f6f8;--fg:#18202a;--mut:#5b6773;--card:#fff}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;height:100vh}
#c{height:100vh;flex:0 0 auto;background:#fff}
#side{flex:1;padding:12px 16px;overflow:auto}
h1{font-size:16px;margin:0 0 4px}.mut{color:var(--mut)}
.card{background:var(--card);border-radius:8px;padding:8px 10px;margin:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style></head><body>
<canvas id="c"></canvas>
<div id="side"><h1>Nimbus — hospital simulator (kinematic stand-in)</h1>
<div class="mut">P1's first-floor map · live robot poses · cloud leases</div>
<div id="robots"></div><h1 style="margin-top:14px">Tasks</h1><div id="tasks" class="mut">…</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
// world rect covered by hospital_topology.png (calibrated from its axes)
const IMG={x0:-17.21,x1:14.56,y0:-39.74,y1:24.52};
const XR=[-14,14],YR=[-36,22];
let M=null,bg=new Image();bg.src='/background.png';
const COL=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#008080'];
const trails={};
function fit(){const h=innerHeight;cv.height=h;cv.width=h*(XR[1]-XR[0])/(YR[1]-YR[0]);}
addEventListener('resize',fit);fit();
const sx=x=>(x-XR[0])/(XR[1]-XR[0])*cv.width, sy=y=>(YR[1]-y)/(YR[1]-YR[0])*cv.height;
function draw(P){
 ctx.clearRect(0,0,cv.width,cv.height);
 if(bg.complete)ctx.drawImage(bg,sx(IMG.x0),sy(IMG.y1),sx(IMG.x1)-sx(IMG.x0),sy(IMG.y0)-sy(IMG.y1));
 if(M){ctx.strokeStyle='#222';ctx.lineWidth=2;for(const[a,b]of M.edges){ctx.beginPath();ctx.moveTo(sx(M.nodes[a].xy[0]),sy(M.nodes[a].xy[1]));ctx.lineTo(sx(M.nodes[b].xy[0]),sy(M.nodes[b].xy[1]));ctx.stroke();}}
 Object.entries(P).forEach(([id,r],i)=>{
  const c=COL[(parseInt(id.slice(1))||i+1)-1]||'#000',t=trails[id]=trails[id]||[];
  t.push([r.x,r.y]);if(t.length>300)t.shift();
  ctx.strokeStyle=c;ctx.globalAlpha=.5;ctx.lineWidth=3;ctx.beginPath();t.forEach(([x,y],k)=>k?ctx.lineTo(sx(x),sy(y)):ctx.moveTo(sx(x),sy(y)));ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(sx(r.x),sy(r.y),9,0,7);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx(r.x),sy(r.y));ctx.lineTo(sx(r.x+.9*Math.cos(r.yaw)),sy(r.y+.9*Math.sin(r.yaw)));ctx.stroke();
  ctx.fillStyle='#000';ctx.font='bold 13px sans-serif';ctx.fillText(id,sx(r.x)+12,sy(r.y)-8);});
}
async function tick(){
 try{const P=(await (await fetch('/poses')).json()).robots;draw(P);
  document.getElementById('robots').innerHTML=Object.entries(P).map(([id,r],i)=>`<div class="card"><span class="dot" style="background:${COL[(parseInt(id.slice(1))||i+1)-1]}"></span><b>${id}</b> ${r.status||''} · zone ${r.zone||'?'} · (${r.x.toFixed(1)}, ${r.y.toFixed(1)})</div>`).join('');}catch(e){}
}
async function tasks(){try{const t=(await (await fetch('/cloud/tasks')).json()).tasks||[];
 document.getElementById('tasks').innerHTML=t.slice(-8).reverse().map(x=>`<div class="card"><b>${x.task_id}</b> ${x.status}<br>${x.request_text||''}${x.lease?`<br><span class="mut">lease v${x.lease.version} · ${x.lease.cluster_id} · ${x.lease.assigned_robots.join(',')}</span>`:''}</div>`).join('')||'none yet';}catch(e){}}
fetch('/map.json').then(r=>r.json()).then(m=>{M=m});
setInterval(tick,150);setInterval(tasks,1500);
</script></body></html>
