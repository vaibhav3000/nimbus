<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus: Requester App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-ground: #0e1116;
    --bg-surface: #11141a;
    --line: #2a3140;
    --line-active: #c4a574;
    --text: #e7e4dc;
    --muted: #8b918a;
    --brass: #c4a574;
    --brass-hover: #d4b584;
    --status-completed: #3d9a6a;
    --status-queued: #c4a574;
    --status-urgent: #c4554a;
    --status-leased: #7f93b0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background-color: var(--bg-ground);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-ground);
    color: var(--text);
  }

  header {
    background: #11141a;
    border-bottom: 1px solid var(--line);
    padding: 18px 36px;
  }
  header h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }
  header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }

  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 28px;
    padding: 24px 36px 40px;
    max-width: 1360px;
    margin: 0 auto;
  }

  .card {
    background: transparent;
    border: none;
    padding: 0;
  }

  h3 {
    margin: 0 0 12px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  h4 {
    margin: 22px 0 10px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--brass);
  }

  /* Composer */
  .composer {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  textarea {
    width: 100%;
    min-height: 84px;
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #11141a;
    color: var(--text);
    resize: vertical;
    transition: border-color 150ms ease;
  }
  textarea:focus, input[type=text]:focus, input[type=number]:focus, select:focus {
    outline: none;
    border-color: var(--brass);
  }
  input[type=text] {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #11141a;
    color: var(--text);
    transition: border-color 150ms ease;
  }
  select, input[type=number] {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #11141a;
    color: var(--text);
  }
  .form-field { margin: 10px 0; }
  .form-field label { display: block; margin-bottom: 4px; font-size: 11px; color: var(--muted); }

  p { margin: 10px 0; }
  button {
    font-family: "Space Grotesk", sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 8px 16px;
    border: 1px solid var(--brass);
    border-radius: 3px;
    background: var(--brass);
    color: #0e1116;
    cursor: pointer;
    transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
  }
  button:hover:not(:disabled) {
    background: var(--brass-hover);
    border-color: var(--brass-hover);
  }
  button:active:not(:disabled) {
    transform: scale(0.97);
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--line);
  }
  button.secondary:hover:not(:disabled) {
    border-color: var(--muted);
    background: rgba(255, 255, 255, 0.03);
  }
  button:disabled { opacity: 0.4; cursor: default; }

  /* Task list */
  ul.tasks {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
    max-height: 520px;
    overflow-y: auto;
  }
  ul.tasks li {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    border-left: 2px solid transparent;
    cursor: pointer;
    background: transparent;
    color: var(--text);
    transition: background-color 150ms ease, border-left-color 150ms ease;
  }
  ul.tasks li:hover {
    background: rgba(255, 255, 255, 0.02);
  }
  ul.tasks li.active {
    background: #181d26;
    border-left-color: var(--brass);
  }
  ul.tasks li strong {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
  }
  ul.tasks li.active strong {
    color: var(--brass);
  }

  /* Status Chips */
  @keyframes state-mark {
    0% { opacity: 0.5; transform: scale(0.97); }
    100% { opacity: 1; transform: scale(1); }
  }
  .chip {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid transparent;
    margin-left: 6px;
    vertical-align: middle;
    line-height: 1.4;
    transition: all 150ms ease;
    animation: state-mark 150ms ease forwards;
  }
  .chip.completed {
    background: rgba(61, 154, 106, 0.15);
    color: var(--status-completed);
    border-color: rgba(61, 154, 106, 0.4);
  }
  .chip.queued, .chip.needs_clarification, .chip.clarify {
    background: rgba(196, 165, 116, 0.15);
    color: var(--status-queued);
    border-color: rgba(196, 165, 116, 0.4);
  }
  .chip.urgent, .chip.rejected, .chip.cancelled {
    background: rgba(196, 85, 74, 0.15);
    color: var(--status-urgent);
    border-color: rgba(196, 85, 74, 0.4);
  }
  .chip.leased {
    background: rgba(127, 147, 176, 0.15);
    color: var(--status-leased);
    border-color: rgba(127, 147, 176, 0.4);
  }
  .chip.paused {
    background: rgba(139, 145, 138, 0.15);
    color: var(--muted);
    border-color: rgba(139, 145, 138, 0.4);
  }

  .notice {
    background: #181d26;
    border: 1px solid var(--line);
    border-left: 3px solid var(--brass);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text);
    margin: 12px 0;
    animation: state-mark 150ms ease forwards;
  }
  .muted {
    color: var(--muted);
    font-size: 12px;
  }
  #task-count {
    color: var(--brass);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
  }

  /* Distinct Lease Block */
  pre.lease {
    background: #11141a;
    color: var(--text);
    border: 1px solid var(--line);
    border-left: 3px solid var(--brass);
    border-radius: 4px;
    padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    overflow-x: auto;
    line-height: 1.45;
    animation: state-mark 150ms ease forwards;
  }

  /* Plain Timeline */
  ol.timeline {
    list-style: none;
    padding: 0;
    margin: 14px 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #11141a;
    overflow: hidden;
  }
  ol.timeline li {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid #1c222d;
    font-size: 12px;
    color: var(--text);
    transition: background-color 150ms ease;
  }
  ol.timeline li:last-child {
    border-bottom: none;
  }
  ol.timeline li:hover {
    background: rgba(255, 255, 255, 0.02);
  }
  ol.timeline li strong {
    min-width: 90px;
    width: 90px;
    flex-shrink: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--status-leased);
  }
  ol.timeline li span.muted {
    margin-left: auto;
    flex-shrink: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* Clarify Question Box */
  .qbox {
    background: #181d26;
    border: 1px solid var(--line);
    border-left: 3px solid var(--brass);
    border-radius: 4px;
    padding: 14px 16px;
    margin-top: 14px;
    color: var(--text);
    font-size: 13px;
    animation: state-mark 150ms ease forwards;
  }
  .qbox strong {
    color: var(--brass);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .qbox input[type=text] {
    margin-top: 8px;
  }
  .qbox button {
    margin-top: 8px;
  }

  .result {
    background: rgba(61, 154, 106, 0.1);
    border: 1px solid rgba(61, 154, 106, 0.35);
    border-radius: 4px;
    padding: 12px 14px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--status-completed);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    animation: state-mark 150ms ease forwards;
  }
</style>
</head>
<body>
<header>
  <h1>Nimbus: Requester App</h1>
  <p>Ward staff: send plain-language requests, answer questions, see status and results (FR-21)</p>
</header>
<main>
  <section class="card">
    <div class="composer">
      <h3>New request</h3>
      <div id="free-text-composer">
        <textarea id="request-text" placeholder="Need an infusion pump at 2B-12, urgent."></textarea>
        <p><button id="send">Send request</button></p>
      </div>
      <form id="c3-form" hidden>
        <p class="muted">Classical baseline: deterministic form entry; no language model.</p>
        <div class="form-field"><label for="c3-item">Item</label><select id="c3-item" required></select></div>
        <div class="form-field"><label for="c3-destination">Destination</label><select id="c3-destination" required></select></div>
        <div class="form-field"><label for="c3-source">Source (optional)</label><select id="c3-source"></select></div>
        <div class="form-field"><label for="c3-priority">Priority</label><select id="c3-priority" required></select></div>
        <div class="form-field"><label for="c3-deadline">Deadline (minutes)</label><input id="c3-deadline" type="number" min="1" required></div>
        <p><button type="submit">Create task</button></p>
      </form>
    </div>
    <h3>My tasks <span class="muted" id="task-count"></span></h3>
    <ul class="tasks" id="task-list"></ul>
  </section>
  <section class="card" id="detail">
    <p class="muted">Select a task on the left. Nothing is lost on refresh: state lives in the API.</p>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
