<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus: Requester App</title>
<style>
  :root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, system-ui, sans-serif;
    color: #1a2226;
    background-color: #f6f5f0;
    line-height: 1.45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #f6f5f0;
    color: #1a2226;
  }
  header {
    background: #0f4044;
    color: #f7f9f9;
    padding: 12px 20px;
    border-bottom: 2px solid #09282b;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  header p {
    margin: 3px 0 0;
    font-size: 12px;
    color: #c7dcde;
  }
  main {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 16px;
    padding: 16px 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: #ffffff;
    border: 1px solid #dcd7cb;
    border-radius: 3px;
    padding: 16px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }
  h3 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #0f4044;
    border-bottom: 1px solid #e8e4da;
    padding-bottom: 6px;
  }
  h4 {
    margin: 16px 0 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #38454c;
  }
  textarea {
    width: 100%;
    min-height: 92px;
    font: inherit;
    font-size: 14px;
    padding: 10px;
    border: 1px solid #b8b3a5;
    border-radius: 2px;
    background: #faf9f6;
    color: #1a2226;
    resize: vertical;
  }
  textarea:focus, input[type=text]:focus {
    outline: 2px solid #0f4044;
    outline-offset: -1px;
    background: #ffffff;
  }
  input[type=text] {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid #b8b3a5;
    border-radius: 2px;
    background: #ffffff;
  }
  p { margin: 8px 0; }
  button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    border: 1px solid #0a2f32;
    border-radius: 2px;
    background: #0f4044;
    color: #ffffff;
    cursor: pointer;
    letter-spacing: 0.2px;
  }
  button:hover { background: #175459; }
  button:active { background: #0a2f32; }
  button.secondary {
    background: #4a5c64;
    border-color: #344248;
    color: #ffffff;
  }
  button.secondary:hover { background: #39484e; }
  button:disabled { opacity: 0.5; cursor: default; }

  ul.tasks {
    list-style: none;
    margin: 8px 0 0;
    padding: 0;
    max-height: 520px;
    overflow-y: auto;
  }
  ul.tasks li {
    padding: 10px;
    border: 1px solid #e0dbce;
    border-left: 3px solid #b2aba0;
    border-radius: 2px;
    margin-bottom: 8px;
    cursor: pointer;
    background: #fdfdfc;
    transition: background 0.1s ease;
  }
  ul.tasks li:hover {
    background: #f5f3ec;
    border-color: #cac3b4;
  }
  ul.tasks li.active {
    border-color: #0f4044;
    border-left: 3px solid #0f4044;
    background: #ebf2f2;
  }
  ul.tasks li strong {
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 12px;
  }

  .chip {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid #c2bdae;
    background: #eae7dc;
    color: #3e4448;
    margin-left: 6px;
    vertical-align: middle;
  }
  .chip.needs_clarification {
    background: #fef3cd;
    border-color: #e0b429;
    color: #7a5800;
  }
  .chip.leased {
    background: #e4f2eb;
    border-color: #8acfa9;
    color: #12572e;
  }
  .chip.completed {
    background: #e6eef5;
    border-color: #9cbacf;
    color: #174268;
  }
  .chip.rejected {
    background: #fbeae8;
    border-color: #e8a69d;
    color: #821f19;
  }
  .chip.queued {
    background: #edece5;
    border-color: #cac6b8;
    color: #55534c;
  }

  .notice {
    background: #fdf7e3;
    border: 1px solid #d6b845;
    border-left: 4px solid #b59218;
    padding: 8px 12px;
    border-radius: 2px;
    font-size: 13px;
    margin: 10px 0;
  }
  .muted {
    color: #5d686f;
    font-size: 12px;
  }
  pre.lease {
    background: #20272b;
    color: #dbe4e8;
    border: 1px solid #141b1f;
    border-radius: 2px;
    padding: 10px;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    overflow-x: auto;
    line-height: 1.4;
  }
  ol.timeline {
    list-style: none;
    padding: 0;
    margin: 8px 0;
    border: 1px solid #dbd6c8;
    border-radius: 2px;
    background: #ffffff;
  }
  ol.timeline li {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 7px 10px;
    border-bottom: 1px solid #eae6dc;
    font-size: 12px;
  }
  ol.timeline li:last-child {
    border-bottom: 0;
  }
  ol.timeline li strong {
    min-width: 85px;
    width: 85px;
    flex-shrink: 0;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #0f4044;
  }
  ol.timeline li span.muted {
    margin-left: auto;
    flex-shrink: 0;
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 11px;
  }
  .qbox {
    background: #fdf8e6;
    border: 1px solid #dcc265;
    border-left: 4px solid #bfa026;
    border-radius: 2px;
    padding: 12px;
    margin-top: 10px;
  }
  .result {
    background: #eaf5ee;
    border: 1px solid #99d2af;
    border-left: 4px solid #23854b;
    border-radius: 2px;
    padding: 12px;
    margin-top: 10px;
    font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>Nimbus: Requester App</h1>
  <p>Ward staff: send plain-language requests, answer questions, see status and results (FR-21)</p>
</header>
<main>
  <section class="card">
    <h3>New request</h3>
    <textarea id="request-text" placeholder="Need an infusion pump at 2B-12, urgent."></textarea>
    <p><button id="send">Send request</button></p>
    <h3>My tasks <span class="muted" id="task-count"></span></h3>
    <ul class="tasks" id="task-list"></ul>
  </section>
  <section class="card" id="detail">
    <p class="muted">Select a task on the left. Nothing is lost on refresh: state lives in the API.</p>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
