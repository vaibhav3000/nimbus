<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus: Requester App</title>
<style>
  :root { font-family: system-ui, sans-serif; }
  body { margin: 0; background: #f4f6f8; color: #1c2733; }
  header { background: #14486b; color: #fff; padding: 10px 18px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: .8; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 14px; padding: 14px; max-width: 1100px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #d7dee5; border-radius: 8px; padding: 12px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 64px; font: inherit; }
  button { font: inherit; padding: 6px 14px; border: 0; border-radius: 6px; background: #14486b; color: #fff; cursor: pointer; }
  button.secondary { background: #5b7183; }
  button:disabled { opacity: .5; cursor: default; }
  ul.tasks { list-style: none; margin: 8px 0 0; padding: 0; }
  ul.tasks li { padding: 8px; border: 1px solid #d7dee5; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  ul.tasks li.active { border-color: #14486b; background: #eef4f9; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: #d7dee5; margin-left: 6px; }
  .chip.needs_clarification { background: #ffd666; }
  .chip.leased { background: #9fd6a9; }
  .chip.completed { background: #7fc9f7; }
  .chip.rejected { background: #f79f9f; }
  .chip.queued { background: #c9c3f0; }
  .notice { background: #fff1c2; border: 1px solid #e6c34d; padding: 6px 10px; border-radius: 6px; margin: 8px 0; }
  .muted { color: #5b7183; font-size: 13px; }
  pre.lease { background: #f4f6f8; padding: 8px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
  ol.timeline { font-size: 13px; padding-left: 18px; }
  .qbox { background: #fff7e0; border: 1px solid #e8c96a; border-radius: 6px; padding: 10px; margin-top: 8px; }
  .result { background: #e8f5ec; border: 1px solid #9fd6a9; border-radius: 6px; padding: 10px; margin-top: 8px; }
  input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: 6px; }
</style>
</head>
<body>
<header>
  <h1>Nimbus: Requester App</h1>
  <p>Ward staff: send plain-language requests, answer questions, see status and results (FR-21)</p>
</header>
<main>
  <section class="card">
    <h3>New request</h3>
    <textarea id="request-text" placeholder="Need an infusion pump at 2B-12, urgent."></textarea>
    <p><button id="send">Send request</button></p>
    <h3>My tasks <span class="muted" id="task-count"></span></h3>
    <ul class="tasks" id="task-list"></ul>
  </section>
  <section class="card" id="detail">
    <p class="muted">Select a task on the left. Nothing is lost on refresh: state lives in the API.</p>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
