<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus map</title>
<style>
  :root { --bg:#0f1720; --panel:#17212c; --line:#2a3a4a; --text:#e6edf3; --dim:#8aa0b2; --east:#4da3ff; --west:#ffb454;
          --shared:#9aa7b4; --bad:#ff5c5c; --warn:#ffcc4d; --ok:#4cd97b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6f8; --panel:#ffffff; --line:#d5dde5; --text:#17212c; --dim:#5a6b7a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header span { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:minmax(320px, 1.3fr) minmax(320px, 1fr); gap:12px; padding:12px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; }
  h2 { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin:0 0 8px; }
  svg { width:100%; height:auto; max-height:70vh; display:block; background:var(--bg); border-radius:6px; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-top:6px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  input[type=text], select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  input[type=text] { width:100%; }
  button { background:var(--line); color:var(--text); border:0; border-radius:6px; padding:5px 9px; font:inherit; cursor:pointer; }
  button:hover { filter:brightness(1.2); }
  button.primary { background:#2f6feb; color:#fff; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; align-items:center; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.sel { background:rgba(77,163,255,.15); }
  tr.task { cursor:pointer; }
  .pill { padding:1px 7px; border-radius:10px; font-size:11px; background:var(--line); }
  .leased { background:#1d5b36; color:#d8ffe6; } .queued { background:#6b5518; color:#fff1c2; }
  .completed { background:#2a3a4a; } .cancelled, .rejected { background:#6b2020; color:#ffd9d9; }
  .needs_clarification { background:#4a2f73; color:#eadcff; } .paused { background:#4a4a4a; }
  .notice { font-size:12px; border-left:3px solid var(--line); padding:2px 8px; margin:4px 0; }
  .notice.WARNING { border-color:var(--warn); } .notice.MAP { border-color:var(--bad); } .notice.ANSWER { border-color:var(--ok); }
  .small { font-size:12px; color:var(--dim); }
  #log { max-height:180px; overflow:auto; font:12px ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>Nimbus live map</h1><span id="meta"></span>
  <span><a href="/" style="color:var(--dim)">requester app</a> · <a href="/operator" style="color:var(--dim)">operator console</a></span>
</header>
<main>
  <div>
    <section>
      <h2>Building</h2>
      <svg id="map" viewBox="0 0 100 100" role="img" aria-label="Hospital map with robots, leases and closures"></svg>
      <div class="legend">
        <span><i class="dot" style="background:var(--east)"></i>east-wing robot</span>
        <span><i class="dot" style="background:var(--west)"></i>west-wing robot</span>
        <span><i class="dot" style="background:var(--bad)"></i>closed / blocked</span>
        <span><i class="dot" style="background:var(--warn)"></i>restricted (hold)</span>
        <span>thick line = a live lease's route · dashed = stop lease</span>
      </div>
    </section>
    <section style="margin-top:12px">
      <h2>Notices</h2><div id="notices"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>Send a request</h2>
      <div class="row"><input id="text" type="text" placeholder='e.g. "Need an infusion pump at 2B-12, urgent."'></div>
      <div class="row">
        <button class="primary" id="send">Send</button>
        <button data-fill="Need an infusion pump at 2B-12, urgent.">SC-1</button>
        <button data-fill="Move a monitor from 2B to 2C, routine">SC-2</button>
        <button data-fill="Ward 2C is now isolation. Get the spare pumps out, hold routine deliveries there, urgent ones can still go in.">SC-3</button>
        <button data-fill="Ward 2C is no longer in isolation.">lift SC-3</button>
      </div>
      <div id="ask" class="small"></div>
      <div class="row small">
        <label><input type="checkbox" id="auto"> act as the edge (robots walk their routes and finish)</label>
      </div>
    </section>
    <section style="margin-top:12px">
      <h2>Tasks</h2>
      <table><thead><tr><th>id</th><th>status</th><th>what</th><th>v / cluster</th></tr></thead><tbody id="tasks"></tbody></table>
    </section>
    <section style="margin-top:12px">
      <h2>Selected task <span id="selname" class="small"></span></h2>
      <div class="row">
        <button id="finish">Edge: finish leg</button>
        <select id="zone"></select>
        <select id="zstate"><option>closed</option><option>blocked</option></select>
        <button id="report">Edge: report zone</button>
        <button id="reopen">Reopen zone</button>
        <button id="pause">Pause</button><button id="cancel">Cancel</button>
      </div>
      <div id="log"></div>
    </section>
  </div>
</main>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const COLORS = { "east-wing": "#4da3ff", "west-wing": "#ffb454" };
let view = null, selected = null, walks = {}, busy = false, lastAsk = null;

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
};
const h = (tag, attrs = {}, text) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
};
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (e) {}
  return [r.status, j];
}
const uid = (p) => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
function say(line) { const d = h("div", {}, `${new Date().toLocaleTimeString()}  ${line}`); $("log").prepend(d); }

// -- drawing --------------------------------------------------------------------------------------------------------
function draw() {
  const svg = $("map"); svg.replaceChildren();
  const xs = view.nodes.map(n => n.x), ys = view.nodes.map(n => n.y);
  const pad = 4, x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const W = x1 - x0, H = y1 - y0, S = 100 / Math.max(W, H);
  svg.setAttribute("viewBox", `0 0 ${W * S} ${H * S}`);
  const P = (n) => [(n.x - x0) * S, (y1 - n.y) * S];          // world y points up, screen y points down
  const byId = Object.fromEntries(view.nodes.map(n => [n.id, n]));
  for (const [a, b] of view.edges) {
    const [ax, ay] = P(byId[a]), [bx, by] = P(byId[b]);
    svg.append(el("line", { x1: ax, y1: ay, x2: bx, y2: by, stroke: "#4a5b6b", "stroke-width": 0.6 }));
  }
  for (const l of view.leases) {                              // live lease routes, in the cluster's colour
    const pts = l.route.filter(z => byId[z]).map(z => P(byId[z]).join(",")).join(" ");
    if (!pts) continue;
    svg.append(el("polyline", { points: pts, fill: "none", stroke: COLORS[l.cluster] || "#fff", "stroke-width": l.stop ? 0.8 : 1.6,
                                "stroke-dasharray": l.stop ? "1.5 1.5" : "none", opacity: 0.85, "stroke-linejoin": "round" }));
  }
  for (const n of view.nodes) {
    const [x, y] = P(n);
    const closed = view.closed[n.id], restr = view.restrictions[n.id];
    const stroke = closed ? "var(--bad)" : restr ? "var(--warn)" : "#6f8294";
    const shape = n.kind === "gate" ? el("rect", { x: x - 2, y: y - 2, width: 4, height: 4, transform: `rotate(45 ${x} ${y})`, fill: "var(--panel)", stroke, "stroke-width": 0.9 })
      : n.kind === "ward" || n.kind === "store" ? el("rect", { x: x - 3, y: y - 2.2, width: 6, height: 4.4, rx: 0.8, fill: "var(--panel)", stroke, "stroke-width": 0.9 })
      : el("circle", { cx: x, cy: y, r: 1.6, fill: "var(--panel)", stroke, "stroke-width": 0.9 });
    const t = el("title"); t.textContent = `${n.id} (${n.kind}, ${n.area})` + (closed ? ` — ${closed.state}` : "") + (restr ? ` — ${restr.kind}` : "");
    shape.append(t); svg.append(shape);
    if (closed) svg.append(el("text", { x, y: y + 0.9, "text-anchor": "middle", fill: "var(--bad)", "font-size": 3.2, "font-weight": "bold" }, "✕"));
    const stock = view.places[n.id];
    const label = n.label.length > 16 ? n.label.slice(0, 15) + "…" : n.label;
    svg.append(el("text", { x, y: y + 5.4, "text-anchor": "middle", fill: "var(--text)", "font-size": 2.1 }, label));
    if (stock && Object.values(stock).some(v => v > 0)) {
      svg.append(el("text", { x, y: y + 7.6, "text-anchor": "middle", fill: "var(--dim)", "font-size": 1.9 }, Object.entries(stock).filter(([, v]) => v > 0).map(([k, v]) => `${v}×${k.replace("infusion_", "")}`).join(" ")));
    }
  }
  const stacked = {};
  for (const r of view.robots) {
    const n = byId[r.zone]; if (!n) continue;
    const [x, y] = P(n); const k = (stacked[n.id] = (stacked[n.id] || 0) + 1) - 1;
    const g = el("g");
    g.append(el("circle", { cx: x + 3.4 + k * 3.2, cy: y - 3.2, r: 1.5, fill: COLORS[r.cluster] || "#fff", stroke: r.task_id ? "#fff" : "none", "stroke-width": 0.5 }));
    g.append(el("text", { x: x + 3.4 + k * 3.2, y: y - 3.2 + 0.7, "text-anchor": "middle", "font-size": 1.7, fill: "#0b1118", "font-weight": "bold" }, r.id.replace(/\D+/g, "") || r.id[0]));
    const t = el("title"); t.textContent = `${r.id} (${r.cluster}) at ${r.zone}` + (r.task_id ? ` running ${r.task_id}` : " idle");
    g.append(t); svg.append(g);
  }
}

function render() {
  $("meta").textContent = `pack ${view.pack} · mode ${view.mode} · model ${view.model} · clusters ${view.clusters.map(c => c.id + ":" + c.health).join(", ")}`;
  const sel = $("zone"), keep = sel.value; sel.replaceChildren(...view.nodes.map(n => h("option", { value: n.id }, n.id))); if (keep) sel.value = keep;
  const body = $("tasks"); body.replaceChildren();
  for (const t of [...view.tasks].reverse().slice(0, 40)) {
    const tr = h("tr", { class: "task" + (t.task_id === selected ? " sel" : "") });
    tr.append(h("td", {}, t.task_id.replace("task-000", "#")));
    const st = h("td"); st.append(h("span", { class: "pill " + t.status }, t.stopped ? t.status + " (stopped)" : t.status)); tr.append(st);
    const what = t.spec ? `${t.spec.item} ${t.spec.source ? t.spec.source + " → " : "→ "}${t.spec.destination}` : t.text;
    tr.append(h("td", {}, what + (t.parent ? " (child)" : "") + (t.status === "queued" && t.reason ? ` — ${t.reason}` : "")));
    tr.append(h("td", {}, t.lease_version ? `v${t.lease_version} ${t.cluster || ""}${t.legs ? ` leg ${t.leg_index + 1}/${t.legs}` : ""}` : ""));
    tr.addEventListener("click", () => { selected = t.task_id; render(); showLog(); });
    body.append(tr);
  }
  $("selname").textContent = selected ? `(${selected})` : "";
  const n = $("notices"); n.replaceChildren();
  for (const x of [...view.notices].reverse().slice(0, 12)) n.append(h("div", { class: "notice " + x.type }, `[${x.audience}${x.cluster_id ? " " + x.cluster_id : ""}${x.zone ? " " + x.zone : ""}] ${x.text}`));
  if (!view.notices.length) n.append(h("div", { class: "small" }, "none yet"));
  draw();
}

async function showLog() {
  if (!selected) return;
  const [, j] = await api("GET", `/tasks/${selected}/timeline`);
  $("log").replaceChildren(...(j.timeline || []).slice(-30).map(r => {
    const o = r.output || {}; return h("div", {}, `v${r.lease_version || "-"} ${r.who.padEnd(9)} ${o.decision || o.event || ""}${o.action ? " action=" + o.action : ""}${o.source ? " " + o.source : ""}`);
  }));
}

async function refresh() {
  if (busy) return; busy = true;
  try { const [, j] = await api("GET", "/map.json"); view = j; render(); if (selected) showLog(); await autoEdge(); }
  catch (e) { $("meta").textContent = "server not reachable: " + e; } finally { busy = false; }
}

// -- acting as the edge (optional): walk each live lease's route, then report it done -------------------------------
async function autoEdge() {
  if (!$("auto").checked) return;
  for (const l of view.leases) {
    const key = `${l.task_id}@${l.version}`;
    if (l.stop) { walks[key] = { done: true }; continue; }
    const w = walks[key] || (walks[key] = { i: 0, done: false });
    if (w.done) continue;
    const robot = l.robots[0], zone = l.route[Math.min(w.i, l.route.length - 1)];
    await api("POST", "/fleet/heartbeat", { cluster_id: l.cluster, robots: [{ id: robot, state: "busy", zone }] });
    if (w.i >= l.route.length - 1) {
      w.done = true;
      const [st] = await api("POST", "/escalations", { type: "OUTPUT_READY", message_id: uid("done"), lease_version: l.version, task_id: l.task_id,
        payload: { result_ref: `s3://nimbus-outputs/${l.task_id}/proof.jpg` } });
      say(`edge: ${l.task_id} v${l.version} finished at ${zone} (HTTP ${st})`);
    } else w.i += 1;
  }
}

// -- actions --------------------------------------------------------------------------------------------------------
const cur = () => view.tasks.find(t => t.task_id === selected);
const curLease = () => view.leases.find(l => l.task_id === selected);
async function send() {
  const text = $("text").value.trim(); if (!text) return;
  if (lastAsk) {                                             // answering a question the cloud asked
    const [st, j] = await api("POST", `/requests/${lastAsk}/answer`, { text, message_id: uid("ans") });
    say(`answer → ${j.status || st}`); lastAsk = null; $("ask").textContent = ""; $("text").value = ""; return refresh();
  }
  const [st, j] = await api("POST", "/requests", { text, message_id: uid("req") });
  selected = j.task_id || selected; $("text").value = "";
  if (j.status === "needs_clarification") { lastAsk = j.task_id; $("ask").textContent = "The cloud asks: " + j.question.question + "  (type your answer above and press Send)"; }
  say(`request → ${j.status || st}`); refresh();
}
$("send").addEventListener("click", send);
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
document.querySelectorAll("button[data-fill]").forEach(b => b.addEventListener("click", () => { lastAsk = null; $("ask").textContent = ""; $("text").value = b.dataset.fill; }));
$("finish").addEventListener("click", async () => {
  const t = cur(); if (!t || !t.lease_version) return;
  const [st, j] = await api("POST", "/escalations", { type: "OUTPUT_READY", message_id: uid("fin"), lease_version: t.lease_version, task_id: t.task_id, payload: { result_ref: "s3://nimbus-outputs/manual/proof.jpg" } });
  say(`edge finish → HTTP ${st} ${j.status || j.error || ""}`); refresh();
});
$("report").addEventListener("click", async () => {
  const t = cur(), l = curLease(); if (!t || !l) return say("select a task with a live lease first");
  const zone = $("zone").value, state = $("zstate").value, robot = view.robots.find(r => r.task_id === t.task_id);
  const [st, j] = await api("POST", "/escalations", { type: "UNEXPECTED_EVENT", message_id: uid("evt"), lease_version: t.lease_version, task_id: t.task_id,
    payload: { what_happened: `${zone} is ${state}`, where: zone, robots_saw: [`${zone} ${state}`], segments: [{ segment_id: zone, state }], ...(robot ? { robot_zone: robot.zone } : {}) } });
  say(`edge report ${zone} ${state} → HTTP ${st} ${j.replanned === undefined ? (j.error || "") : "replanned=" + j.replanned}`); refresh();
});
$("reopen").addEventListener("click", async () => { const [st] = await api("POST", "/map/reopen", { zone: $("zone").value }); say(`reopen ${$("zone").value} → HTTP ${st}`); refresh(); });
for (const a of ["pause", "cancel"]) $(a).addEventListener("click", async () => {
  if (!selected) return; const [st, j] = await api("POST", `/tasks/${selected}/control`, { action: a, message_id: uid(a) }); say(`${a} → HTTP ${st} ${j.status || j.error || ""}`); refresh();
});
refresh(); setInterval(refresh, 1500);
</script>
</body>
</html>
